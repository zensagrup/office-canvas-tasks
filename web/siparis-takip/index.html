<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Takip</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; background: #f4f6f9; color: #222; }
  header { background: #1F4E78; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 20px; }
  .container { max-width: 1280px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 10px; }
  label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .btn { background: #1F4E78; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #163a59; }
  .btn.small { padding: 4px 9px; font-size: 12px; margin-right: 4px; }
  .btn.edit { background: #e08e0b; }
  .btn.del { background: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #1F4E78; color: #fff; position: sticky; top: 0; }
  tr:hover { background: #f9fbfd; }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { background: #eef3f8; border-radius: 8px; padding: 12px 18px; min-width: 150px; }
  .stat .v { font-size: 20px; font-weight: 700; color: #1F4E78; }
  .stat .l { font-size: 12px; color: #666; }
  .neg { color: #c0392b; font-weight: 600; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  #msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; display: none; }
  #msg.ok { background: #d4edda; color: #155724; }
  #msg.err { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<header>
  <h1>📦 Sipariş Takip</h1>
  <span id="clock"></span>
</header>

<div class="container">
  <div id="msg"></div>

  <!-- Özet -->
  <div class="card">
    <h3 style="margin-top:0">Özet</h3>
    <div class="summary" id="summary"></div>
  </div>

  <!-- Form -->
  <div class="card">
    <h3 style="margin-top:0" id="formTitle">Yeni Sipariş Ekle</h3>
    <input type="hidden" id="editId">
    <div class="grid">
      <div><label>İş Son Durumu</label>
        <select id="is_son_durumu">
          <option>Tamamlandı</option><option>Devam Ediyor</option><option>Beklemede</option>
        </select></div>
      <div><label>Tarih (GG.AA.YYYY)</label><input id="tarih" placeholder="25.08.2026"></div>
      <div><label>Sipariş Alınan Firma</label><input id="firma"></div>
      <div><label>Ürün Adı</label><input id="urun_adi"></div>
      <div><label>Renk</label><input id="renk"></div>
      <div><label>Adet</label><input id="adet" type="number" step="1"></div>
      <div><label>Birim Fiyat (TL)</label><input id="birim_fiyat" type="number" step="0.01"></div>
      <div><label>Çanta Fiyatı (TL)</label><input id="cantafi_fiyat" type="number" step="0.01"></div>
      <div><label>Verilen Fiyat</label><input id="verilen_fiyat" type="number" step="0.01"></div>
      <div><label>Alınan Ödeme</label><input id="alinan_odeme" type="number" step="0.01"></div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn" onclick="kaydet()">Kaydet</button>
      <button class="btn" onclick="temizla()" style="background:#888">Temizle</button>
    </div>
  </div>

  <!-- Tablo -->
  <div class="card">
    <h3 style="margin-top:0">Siparişler</h3>
    <div style="overflow-x:auto">
      <table id="tbl">
        <thead><tr>
          <th>ID</th><th>Durum</th><th>Tarih</th><th>Firma</th><th>Ürün</th><th>Renk</th>
          <th>Adet</th><th>Birim ₺</th><th>Çanta ₺</th><th>Verilen ₺</th><th>Kalan Para ₺</th>
          <th>Alınan ₺</th><th>Kalan Ödeme ₺</th><th>İşlem</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const fmt = n => (n==null?'':Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺');
function showMsg(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className=ok?'ok':'err'; m.style.display='block'; setTimeout(()=>m.style.display='none',3000); }
function veri(){
  return {
    is_son_durumu: document.getElementById('is_son_durumu').value,
    tarih: document.getElementById('tarih').value,
    firma: document.getElementById('firma').value,
    urun_adi: document.getElementById('urun_adi').value,
    renk: document.getElementById('renk').value,
    adet: +document.getElementById('adet').value || 0,
    birim_fiyat: +document.getElementById('birim_fiyat').value || 0,
    cantafi_fiyat: +document.getElementById('cantafi_fiyat').value || 0,
    verilen_fiyat: +document.getElementById('verilen_fiyat').value || 0,
    alinan_odeme: +document.getElementById('alinan_odeme').value || 0,
  };
}
async function yukle(){
  const r = await fetch('/api/siparisler'); const d = await r.json();
  const tb = document.querySelector('#tbl tbody'); tb.innerHTML='';
  let tVer=0,tAlin=0,tKalPar=0,tKalOd=0;
  d.forEach(s=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${s.id}</td><td>${s.is_son_durumu}</td><td>${s.tarih||''}</td><td>${s.firma||''}</td>
      <td>${s.urun_adi||''}</td><td>${s.renk||''}</td><td>${s.adet||0}</td>
      <td>${fmt(s.birim_fiyat)}</td><td>${fmt(s.cantafi_fiyat)}</td><td>${fmt(s.verilen_fiyat)}</td>
      <td class="${s.kalan_para<0?'neg':''}">${fmt(s.kalan_para)}</td>
      <td>${fmt(s.alinan_odeme)}</td><td class="${s.kalan_odeme<0?'neg':''}">${fmt(s.kalan_odeme)}</td>
      <td><button class="btn small edit" onclick="duzenle(${s.id})">✏</button>
          <button class="btn small del" onclick="sil(${s.id})">🗑</button></td>`;
    tb.appendChild(tr);
    tVer+=(+s.verilen_fiyat||0); tAlin+=(+s.alinan_odeme||0);
    tKalPar+=(+s.kalan_para||0); tKalOd+=(+s.kalan_odeme||0);
  });
  document.getElementById('summary').innerHTML=`
    <div class="stat"><div class="v">${d.length}</div><div class="l">Toplam Sipariş</div></div>
    <div class="stat"><div class="v">${fmt(tVer)}</div><div class="l">Verilen Fiyat</div></div>
    <div class="stat"><div class="v">${fmt(tAlin)}</div><div class="l">Alınan Ödeme</div></div>
    <div class="stat"><div class="v ${tKalOd<0?'neg':''}">${fmt(tKalOd)}</div><div class="l">Kalan Ödeme</div></div>
    <div class="stat"><div class="v ${tKalPar<0?'neg':''}">${fmt(tKalPar)}</div><div class="l">Kalan Para</div></div>`;
}
async function kaydet(){
  const id=document.getElementById('editId').value;
  const opt={method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(veri())};
  const url=id?`/api/siparisler/${id}`:'/api/siparisler';
  const r=await fetch(url,opt);
  if(r.ok){ showMsg(id?'Güncellendi':'Eklendi',true); temizla(); yukle(); }
  else showMsg('Hata: '+await r.text(),false);
}
function duzenle(id){
  fetch('/api/siparisler').then(r=>r.json()).then(d=>{
    const s=d.find(x=>x.id==id); if(!s)return;
    document.getElementById('editId').value=id;
    document.getElementById('is_son_durumu').value=s.is_son_durumu||'';
    document.getElementById('tarih').value=s.tarih||'';
    document.getElementById('firma').value=s.firma||'';
    document.getElementById('urun_adi').value=s.urun_adi||'';
    document.getElementById('renk').value=s.renk||'';
    document.getElementById('adet').value=s.adet||0;
    document.getElementById('birim_fiyat').value=s.birim_fiyat||0;
    document.getElementById('cantafi_fiyat').value=s.cantafi_fiyat||0;
    document.getElementById('verilen_fiyat').value=s.verilen_fiyat||0;
    document.getElementById('alinan_odeme').value=s.alinan_odeme||0;
    document.getElementById('formTitle').textContent='Sipariş #'+id+' Düzenle';
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
async function sil(id){
  if(!confirm('Silinsin mi?'))return;
  const r=await fetch('/api/siparisler/'+id,{method:'DELETE'});
  if(r.ok){ showMsg('Silindi',true); yukle(); } else showMsg('Silinemedi',false);
}
function temizla(){
  document.getElementById('editId').value='';
  document.querySelectorAll('input').forEach(i=>i.value='');
  document.getElementById('is_son_durumu').selectedIndex=0;
  document.getElementById('formTitle').textContent='Yeni Sipariş Ekle';
}
document.getElementById('clock').textContent=new Date().toLocaleString('tr-TR');
yukle();
</script>
</body>
</html>
